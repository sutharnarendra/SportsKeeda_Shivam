spring.application.name=YatraX

# Database Connection Mappings
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# PgBouncer Connection Pooling Optimizations
spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.datasource.hikari.leak-detection-threshold=0

# Security RBAC Environment Mappings
app.security.superadmin.password=${SUPERADMIN_PASSWORD}
app.security.admin.password=${ADMIN_PASSWORD}
app.security.alloy.password=${ALLOY_PASSWORD}

# Actuator Endpoint Exposure
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=always
management.health.mail.enabled=false

# Tomcat Web Server MBean Exposure for thread metrics
server.tomcat.mbeanregistry.enabled=true

#Mail Gateway Environment Mappings
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Upstash Redis Connection Configuration
spring.data.redis.host=${UPSTASH_REDIS_HOST}
spring.data.redis.port=${UPSTASH_REDIS_PORT:6379}
spring.data.redis.password=${UPSTASH_REDIS_PASSWORD}
spring.data.redis.ssl.enabled=true

# Cloudflare R2 Mappings
r2.access-key=${R2_ACCESS_KEY}
r2.secret-key=${R2_SECRET_KEY}
r2.endpoint=${R2_ENDPOINT}
r2.bucket-name=${R2_BUCKET_NAME}
r2.public-url=${R2_PUBLIC_URL}

# Cloudinary Mappings
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

#Google OAuth 2.0 Client Configuration
google.client-id = ${GOOGLE_CLIENT_ID}

# Production Environment & Security Mappings
app.frontend.url=${FRONTEND_URL:http://localhost:5173}
app.backend.url=${BACKEND_URL:http://localhost:8080}
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
app.webhook.secret=${WEBHOOK_SECRET:webhook-secret-key-yatrax}

