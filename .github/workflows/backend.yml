name: Yatra X Backend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
          cache-dependency-path: 'backend/pom.xml'

      - name: Build JAR with Maven
        run: |
          cd backend
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Prepare Remote Directory
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ORACLE_VM_IP }}
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            sudo mkdir -p /opt/yatrax/deploy-temp
            sudo chown ubuntu:ubuntu /opt/yatrax/deploy-temp

      - name: Copy JAR to Oracle VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ORACLE_VM_IP }}
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          port: 22
          source: "backend/target/backend-0.0.1-SNAPSHOT.jar"
          target: "/opt/yatrax/deploy-temp/"
          strip_components: 2
          overwrite: true
          timeout: 120s

      - name: Deploy JAR and Restart Service
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ORACLE_VM_IP }}
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            set -e
            echo "=== Deploying Yatra X Backend ==="

            # Move JAR to application directory
            sudo mkdir -p /opt/yatrax
            sudo cp /opt/yatrax/deploy-temp/backend-0.0.1-SNAPSHOT.jar /opt/yatrax/yatrax.jar
            sudo chown ubuntu:ubuntu /opt/yatrax/yatrax.jar

            # Restart the systemd service (or start if first run)
            if systemctl is-active --quiet yatrax.service; then
              echo "Restarting yatrax.service..."
              sudo systemctl restart yatrax.service
            else
              echo "Starting yatrax.service for the first time..."
              sudo systemctl daemon-reload
              sudo systemctl enable yatrax.service
              sudo systemctl start yatrax.service
            fi

            # Wait a few seconds and check status
            sleep 5
            sudo systemctl status yatrax.service --no-pager || true

            # Cleanup temp
            rm -rf /opt/yatrax/deploy-temp

            echo "=== Deployment complete ==="
